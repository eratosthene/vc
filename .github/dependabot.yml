version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Updates Pipfile.lock (and the Pipfile, for upgrades outside its version
  # ranges). Minor and patch updates come grouped in a single PR.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # The base image in docker/Dockerfile.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
