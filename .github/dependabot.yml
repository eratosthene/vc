version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Updates Pipfile.lock (and the Pipfile, for upgrades outside its version
  # ranges). Minor and patch updates come grouped in a single PR.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # The base image in docker/Dockerfile. The Python version is chosen by hand
  # (the tag is `3.12-alpine`, so a new Python release looks like a minor
  # update), and `docker build --pull` already picks up its patch releases.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
